name: Build repo

on:
  push:
    branches: [main]
    paths: ["debs/**", "build_repo.py", "CydiaIcon.png", ".github/workflows/*.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate Packages and Release
        run: python3 build_repo.py

      - name: Commit regenerated files
        run: |
          git config user.name "SuperYosh23"
          git config user.email "SuperYosh23@users.noreply.github.com"
          git add Packages Packages.gz Packages.bz2 Release
          git diff --cached --quiet || git commit -m "Rebuild Packages and Release"
          git push origin main